name: Update Google Scholar citations

on:
  schedule:
    - cron: "23 5 * * *"   # every day, 05:23 UTC
  workflow_dispatch:        # "Run workflow" button in the Actions tab

permissions:
  contents: write

concurrency:
  group: scholar-citations
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch citation metrics
        run: python3 scripts/update_citations.py
        env:
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}   # optional fallback

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/citations.json
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "Update Google Scholar citations"
            git push
          fi
